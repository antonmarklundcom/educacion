name: Lighthouse

# Manual, and against a URL that is actually serving.
#
# It is deliberately NOT part of the PR check. Lighthouse needs a running app,
# and every SEO surface on this site is `force-dynamic` against MySQL
# (architecture.md §3) — CI has no DATABASE_URL, so a run there would measure
# error pages and report a number that means nothing. A green build that
# measured 500s is worse than no measurement.
#
# Run it against production, or against a Hostinger deploy of the branch:
#   gh workflow run lighthouse.yml -f url=https://educacion.com.py
#
# Locally, against a production build on this machine:
#   npm run build && npm run start &
#   npm run perf:lighthouse -- --url http://localhost:3000
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to audit (must be serving real pages)'
        required: true
        default: 'https://educacion.com.py'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Manual or not, an unbounded `lhci autorun` against an unresponsive origin
    # would otherwise bill up to GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rewrite lives in scripts/lighthouse.ts so the same command a
      # developer runs locally is the one that runs here (PR-53).
      - run: npm run perf:lighthouse -- --url "${{ inputs.url }}"
