name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # architecture.md §9's 150 kB gzipped budget, enforced rather than
      # remembered (PR-34). It reads the manifest `next build` just wrote, so
      # it needs no database and no running server.
      - run: npm run perf:budget
